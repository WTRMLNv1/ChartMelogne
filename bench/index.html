<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChartMelogne Benchmark Suite (M0 Baseline)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #131722;
      color: #d1d4dc;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    header {
      background: #1e222d;
      border-bottom: 1px solid #2a2e39;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      z-index: 10;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background: #2962ff;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stats-bar {
      display: flex;
      gap: 16px;
      font-size: 12px;
      background: #131722;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #2a2e39;
    }
    .stat-item {
      display: flex;
      gap: 6px;
    }
    .stat-label {
      color: #787b86;
    }
    .stat-val {
      font-weight: 600;
      color: #26a69a;
      font-variant-numeric: tabular-nums;
    }
    .stat-val.warn {
      color: #ef5350;
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      background: #2a2e39;
      color: #d1d4dc;
      border: 1px solid #363a45;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    button:hover:not(:disabled) {
      background: #363a45;
      color: #fff;
    }
    button.primary {
      background: #2962ff;
      border-color: #2962ff;
      color: #fff;
    }
    button.primary:hover:not(:disabled) {
      background: #1e53e5;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #chart-container {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }
    #bench-overlay {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(30, 34, 45, 0.92);
      border: 1px solid #363a45;
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      font-size: 12px;
      max-width: 420px;
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
    }
    #bench-overlay.active {
      display: block;
    }
    .bench-title {
      font-weight: 600;
      color: #2962ff;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .progress-bar-bg {
      background: #131722;
      border-radius: 3px;
      height: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-bar-fill {
      background: #2962ff;
      height: 100%;
      width: 0%;
      transition: width 0.1s linear;
    }
    pre {
      font-family: monospace;
      font-size: 11px;
      color: #b2b5be;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h2>ChartMelogne</h2>
      <span class="badge">M0 Baseline</span>
    </div>

    <div class="stats-bar">
      <div class="stat-item"><span class="stat-label">Bars:</span><span class="stat-val" id="stat-bars">0</span></div>
      <div class="stat-item"><span class="stat-label">Visible:</span><span class="stat-val" id="stat-visible">0</span></div>
      <div class="stat-item"><span class="stat-label">FPS:</span><span class="stat-val" id="stat-fps">--</span></div>
      <div class="stat-item"><span class="stat-label">p95:</span><span class="stat-val" id="stat-p95">-- ms</span></div>
      <div class="stat-item"><span class="stat-label">Upload:</span><span class="stat-val" id="stat-upload">-- ms</span></div>
      <div class="stat-item"><span class="stat-label">Heap:</span><span class="stat-val" id="stat-heap">-- MB</span></div>
    </div>

    <div class="controls">
      <button class="primary" id="btn-run-all">Run All (50s)</button>
      <button id="btn-pan">1. Pan</button>
      <button id="btn-zoom">2. Zoom</button>
      <button id="btn-tick">3. Live Tick</button>
      <button id="btn-append">4. Append</button>
      <button id="btn-resize">5. Resize</button>
      <button id="btn-export" disabled>Export JSON</button>
      <button id="btn-theme">Toggle Theme</button>
    </div>
  </header>

  <div id="chart-container"></div>

  <div id="bench-overlay">
    <div class="bench-title">
      <span id="bench-scenario-name">Running Scenario...</span>
      <span id="bench-timer">0s / 10s</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="bench-progress"></div>
    </div>
    <pre id="bench-output">Initializing...</pre>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>

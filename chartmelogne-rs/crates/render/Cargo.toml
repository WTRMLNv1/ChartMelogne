[package]
name = "chartmelogne-render"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"

[dependencies]
chartmelogne-core = { path = "../core" }
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[package]
name = "chartmelogne-slint"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"

[dependencies]
chartmelogne-core = { path = "../core" }
chartmelogne-render = { path = "../render" }
slint = { version = "~1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg-wgpu",
    "unstable-wgpu-30",
    "raw-window-handle-06",
    "compat-1-18",
] }
wgpu = "30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

[build-dependencies]
slint-build = "~1.18"

[[bin]]
name = "chartmelogne"
path = "src/main.rs"

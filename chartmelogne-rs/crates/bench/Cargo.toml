[package]
name = "chartmelogne-bench"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"

[dependencies]
chartmelogne-core = { path = "../core" }
chartmelogne-render = { path = "../render" }
chartmelogne-slint = { path = "../slint" }
wgpu = "30"
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "bench"
path = "src/main.rs"
